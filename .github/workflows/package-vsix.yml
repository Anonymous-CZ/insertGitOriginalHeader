name: Package and Release VSIX

on:
  push:
    tags:
      - 'v*.*.*'

env:
  # Opt into Node.js 24 for JavaScript-based GitHub Actions ahead of the runner default switch.
  # This removes Node.js 20 deprecation warnings and surfaces incompatibilities early.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      VSCE_TRUSTED_WORKSPACES: 'true'
    
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    
    steps:
      - name: 检出代码（包含标签信息）
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 提取版本号（不含v前缀）
        id: extract_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.7.1
          run_install: false

      - name: 配置 pnpm 缓存
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: 安装依赖
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: 执行单一打包命令
        run: VSIX_VERSION=${{ steps.extract_version.outputs.version }} pnpm run package-vsix

      - name: 上传 VSIX 作为构件（临时存储）
        uses: actions/upload-artifact@v7
        with:
          name: extension-vsix
          path: out/*.vsix
          if-no-files-found: error

  create-release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 关键：需要写入权限来创建Release
      actions: read    # 需要读取权限来下载 workflow artifacts
    
    steps:
      - name: 下载 VSIX 构件
        uses: actions/download-artifact@v8
        with:
          name: extension-vsix
          path: out
          
      - name: 显示下载的文件列表
        run: ls -la out/
          
      - name: 创建 GitHub Release 并上传 VSIX
        uses: softprops/action-gh-release@v3
        with:
          name: Release v${{ needs.package.outputs.version }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
          files: |
            out/*.vsix
          body: |
            ## 版本 ${{ needs.package.outputs.version }}
            
            ### 更新说明
            
            ### 安装方式
            1. 下载下方的 `.vsix` 文件
            2. 在 VSCode 中运行 "Extensions: Install from VSIX..."
            3. 选择下载的 `.vsix` 文件
            
            ### 校验信息
            - 构建时间: ${{ github.event.head_commit.timestamp }}
            - 提交: ${{ github.sha }}