name: Package VSIX


on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 关键：为你的插件功能获取完整Git历史

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.7.1
          run_install: false

      - name: 配置 pnpm 缓存
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: 安装依赖 (灵活处理锁文件)
        run: |
          # 检查锁文件是否存在
          if [ -f pnpm-lock.yaml ]; then
            echo "找到 pnpm-lock.yaml，使用冻结锁文件安装"
            pnpm install --frozen-lockfile
          else
            echo "未找到 pnpm-lock.yaml，生成新的锁文件"
            pnpm install
          fi

      - name: 构建并打包 (package 脚本)
        run: |
          pnpm run prepackage-vsix
          pnpm run package-vsix

      - name: 生成 VSIX 文件 (vsix 脚本)
        run: pnpm run vsix

      - name: 上传 VSIX 作为构件
        uses: actions/upload-artifact@v4
        with:
          name: extension-vsix-v${{ github.ref_name }}
          path: '*.vsix'