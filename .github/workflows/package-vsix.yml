name: Package VSIX

on:
  # 移除 workflow_dispatch（手动触发）和 push/pull_request 条件
  push:
    tags:
      - 'v*.*.*'  # 只监听符合版本号格式的标签，如 v1.0.0

jobs:
  package:
    runs-on: ubuntu-latest
    # 添加环境变量，确保vsce使用正确的工作目录
    env:
      VSCE_TRUSTED_WORKSPACES: 'true'
    
    steps:
      - name: 检出代码（包含标签信息）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，对插件功能很重要

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.7.1
          run_install: false

      - name: 配置 pnpm 缓存
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: 安装依赖
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: 执行单一打包命令
        run: pnpm run package-vsix

      - name: 上传 VSIX 作为构件
        uses: actions/upload-artifact@v4
        with:
          name: extension-vsix-${{ github.ref_name }}  # 使用标签名，如 v1.0.0
          path: '*.vsix'